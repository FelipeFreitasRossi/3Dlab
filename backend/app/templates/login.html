{% extends "base.html" %}
{% block title %}Entrar — Pedra Lunar Admin{% endblock %}
{% block content %}
<main class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <img
        src="https://i.postimg.cc/KYFJDsWs/Pedra-Lunar.jpg"
        alt="Pedra Lunar"
        class="login-logo"
        width="56"
        height="56"
      >
      <h1>Pedra Lunar <span>Admin</span></h1>
      <p class="login-subtitle">Acesso restrito ao dono da loja</p>
    </div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="password">Senha de acesso</label>
        <div class="input-with-toggle">
          <input
            type="password"
            id="password"
            name="password"
            required
            autofocus
            autocomplete="current-password"
            placeholder="Digite sua senha"
          >
          <button
            type="button"
            class="toggle-password"
            id="toggle-password"
            aria-label="Mostrar senha"
            tabindex="-1"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <p id="login-error" class="login-error" hidden></p>

      <button type="submit" class="btn-primary btn-block">
        Entrar no painel
      </button>
    </form>

    <p class="login-footer">
      Painel privado · <a href="/" target="_blank" rel="noopener">Ver site público</a>
    </p>
  </div>
</main>
{% endblock %}

{% block scripts %}
<script>
  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('login-error');
  const passwordInput = document.getElementById('password');
  const toggleBtn = document.getElementById('toggle-password');
  const submitBtn = form.querySelector('button[type="submit"]');

  toggleBtn.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    toggleBtn.setAttribute('aria-label', isPassword ? 'Ocultar senha' : 'Mostrar senha');
    passwordInput.focus();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.hidden = true;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Verificando...';

    try {
      const fd = new FormData(form);
      const res = await fetch('/admin/api/login', { method: 'POST', body: fd });

      if (res.ok) {
        window.location.href = '/admin/';
        return;
      }

      const data = await res.json().catch(() => ({}));
      errorEl.textContent = data.detail || 'Senha incorreta';
      errorEl.hidden = false;
      passwordInput.select();
    } catch {
      errorEl.textContent = 'Erro de conexão. Tente novamente.';
      errorEl.hidden = false;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Entrar no painel';
    }
  });
</script>
{% endblock %}
